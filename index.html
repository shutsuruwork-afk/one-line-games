<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ひとすじ</title>
<meta name="description" content="画面のすべてが一本の線でできたワンボタンゲーム。">
<style>
  /* 画面全体が一枚のキャンバス。描くのは、切れ目のない一本の線だけ。 */
  :root {
    --paper: #e4eae6;   /* 少し緑がかった灰色の紙 */
    --ink:   #17201b;   /* 線の色 */
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --paper: #111714; --ink: #dce6df; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --paper: #111714; --ink: #dce6df; color-scheme: dark; }

  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: var(--paper);
    color: var(--ink);
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
  #safe { position: fixed; visibility: hidden; pointer-events: none;
          padding-top: env(safe-area-inset-top, 0px); }
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="ひとすじ。一本の線でできたゲーム。タップ、クリック、またはスペースキーでジャンプ。長押しで高く跳ぶ。"></canvas>
<div id="safe"></div>
<script>
(() => {
  'use strict';

  const cvs = document.getElementById('c');
  const ctx = cvs.getContext('2d');
  const safeProbe = document.getElementById('safe');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- 画面サイズ ----------
  let W, H, S, DPR, gy, margin, px, safeTop;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    W = window.innerWidth; H = window.innerHeight;
    cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
    S = Math.max(0.62, Math.min(1.4, Math.min(H / 700, W / 520)));
    gy = H * 0.64;
    margin = Math.max(16, W * 0.04);
    px = Math.max(margin + 120 * S, W * 0.27);
    safeTop = parseFloat(getComputedStyle(safeProbe).paddingTop) || 0;
  }
  addEventListener('resize', resize);
  resize();

  // ---------- 色(テーマに追従) ----------
  let paper = '#e4eae6', ink = '#17201b';
  function readColors() {
    const cs = getComputedStyle(document.documentElement);
    paper = cs.getPropertyValue('--paper').trim() || paper;
    ink = cs.getPropertyValue('--ink').trim() || ink;
  }
  readColors();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readColors);
  new MutationObserver(readColors).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  // ---------- 保存 ----------
  let best = 0;
  try { best = parseInt(localStorage.getItem('hitosuji-best') || '0', 10) || 0; } catch (e) {}
  function saveBest() { try { localStorage.setItem('hitosuji-best', String(best)); } catch (e) {} }

  // ---------- 音(弦をはじく) ----------
  let actx = null, muted = false, note = 0;
  const SCALE = [0, 2, 4, 7, 9, 12, 9, 7, 4, 2];
  function audio() {
    if (!actx) {
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
    }
    if (actx && actx.state === 'suspended') actx.resume();
    return actx;
  }
  function pluck(semi, dur = 0.5, vol = 0.18, type = 'triangle') {
    if (muted) return;
    const a = audio(); if (!a) return;
    const t = a.currentTime;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(196 * Math.pow(2, semi / 12) * 1.01, t);
    o.frequency.exponentialRampToValueAtTime(196 * Math.pow(2, semi / 12), t + 0.05);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function snapSound() {
    if (muted) return;
    const a = audio(); if (!a) return;
    const t = a.currentTime;
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(140, t);
    o.frequency.exponentialRampToValueAtTime(38, t + 0.5);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.35, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + 0.65);
  }

  // ---------- 障害物(線のとげ) ----------
  // 頂点は [横, 高さ] 。単位は S 倍される。
  function teeth(n, w, h) {
    const v = [[0, 0]];
    for (let i = 0; i < n; i++) v.push([i * w + w / 2, h], [i * w + w, 0]);
    return v;
  }
  const SHAPES = {
    spike: () => [[0, 0], [15, 40], [30, 0]],
    tall:  () => [[0, 0], [12, 64], [24, 0]],
    twin:  () => [[0, 0], [14, 36], [28, 0], [42, 36], [56, 0]],
    saw:   () => teeth(5, 20, 20),
    pair:  () => [[0, 0], [14, 34], [28, 0], [118, 0], [132, 34], [146, 0]],
    block: () => [[0, 0], [3, 32], [57, 32], [60, 0]],
    ramp:  () => [[0, 0], [70, 46], [78, 0]],
  };
  function pickShape(score) {
    const pool = ['spike', 'spike', 'tall', 'twin'];
    if (score >= 12) pool.push('saw', 'pair');
    if (score >= 28) pool.push('block', 'ramp', 'tall');
    if (score >= 60) pool.push('pair', 'saw', 'block');
    return pool[(Math.random() * pool.length) | 0];
  }
  function makeObstacle(name, x) {
    const v = SHAPES[name]().map(([a, b]) => [a * S, b * S]);
    return { name, x, v, w: v[v.length - 1][0] };
  }
  function profile(o, x) {
    const lx = x - o.x;
    if (lx <= 0 || lx >= o.w) return 0;
    const v = o.v;
    for (let i = 1; i < v.length; i++) {
      if (lx <= v[i][0]) {
        const [x0, y0] = v[i - 1], [x1, y1] = v[i];
        const span = x1 - x0;
        return span <= 0 ? Math.max(y0, y1) : y0 + (y1 - y0) * (lx - x0) / span;
      }
    }
    return 0;
  }

  // ---------- 状態 ----------
  const R = () => 14 * S;
  let state = 'title';      // title | play | dead
  let obstacles = [];
  let speed, runT, dist, score, gapLeft;
  let h, vy, holding, buffer, coyote, squash, loopScale, deadT, shake;
  let aiHold = 0, demoHits = 0;
  const waves = [];

  function surf(x) {
    for (const o of obstacles) {
      if (x > o.x && x < o.x + o.w) return profile(o, x);
    }
    return 0;
  }
  function wob(x) {
    let y = 0;
    for (const w of waves) {
      const dx = Math.abs(x - w.x);
      const env = Math.exp(-3.2 * w.t) * Math.exp(-dx / (240 * S));
      if (env < 0.002) continue;
      y += w.A * env * Math.sin(dx * 0.045 / S - 24 * w.t);
    }
    return y;
  }
  function addWave(x, A) {
    if (reduceMotion) A *= 0.35;
    waves.push({ x, A, t: 0 });
    if (waves.length > 8) waves.shift();
  }

  function resetRun(mode) {
    state = mode;
    obstacles = [];
    speed = 330 * S;
    runT = 0; dist = 0; score = 0;
    gapLeft = W * 0.55;
    h = 0; vy = 0; holding = false; buffer = 0; coyote = 0; squash = 0;
    deadT = 0; shake = 0; aiHold = 0;
    loopScale = 0;
  }
  resetRun('title');
  loopScale = 1;

  function startRun() {
    resetRun('play');
    addWave(px, 9 * S);
    pluck(0, 0.7, 0.16);
  }

  function die() {
    state = 'dead';
    deadT = 0;
    shake = reduceMotion ? 0 : 10 * S;
    addWave(px, 22 * S);
    snapSound();
    if (score > best) { best = score; saveBest(); }
  }

  // ---------- 入力 ----------
  function press() {
    audio();
    if (state === 'title') { startRun(); holding = true; buffer = 0.12; return; }
    if (state === 'dead') { if (deadT > 0.5) { startRun(); holding = true; buffer = 0.12; } return; }
    holding = true; buffer = 0.12;
  }
  function release() { holding = false; }

  cvs.addEventListener('pointerdown', e => { e.preventDefault(); cvs.focus(); press(); });
  addEventListener('pointerup', release);
  addEventListener('pointercancel', release);
  addEventListener('keydown', e => {
    if (e.code === 'KeyM') { muted = !muted; return; }
    if (['Space', 'ArrowUp', 'KeyW', 'Enter'].includes(e.code)) {
      e.preventDefault();
      if (!e.repeat) press();
    }
  });
  addEventListener('keyup', e => {
    if (['Space', 'ArrowUp', 'KeyW', 'Enter'].includes(e.code)) release();
  });
  addEventListener('blur', release);

  // ---------- 更新 ----------
  function jump() {
    vy = 920 * S; h = Math.max(h, 0.01); buffer = 0; coyote = 0;
    squash = -0.22;
    addWave(px, 5 * S);
    pluck(SCALE[note++ % SCALE.length], 0.55, 0.15);
  }

  function demoBrain(dt) {
    // タイトル画面では線がひとりで遊んで見せる
    if (h <= 0) {
      const o = obstacles.find(o => o.x + o.w > px - R());
      if (o && o.x + o.w / 2 - px < speed * 0.52 && o.x - px > -R()) { aiHold = 0.32; jump(); }
    }
    if (aiHold > 0) aiHold -= dt;
    return aiHold > 0;
  }

  function update(dt) {
    for (const w of waves) w.t += dt;
    while (waves.length && waves[0].t > 2) waves.shift();
    shake *= Math.pow(0.0008, dt);
    squash *= Math.pow(0.002, dt);

    if (state === 'dead') {
      deadT += dt;
      loopScale = Math.max(0, 1 - deadT / 0.35);
      speed *= Math.pow(0.02, dt);
    } else {
      loopScale = Math.min(1, loopScale + dt / 0.25);
      if (state === 'play') {
        runT += dt;
        speed = Math.min(720, 330 + 10 * runT) * S;
      } else {
        speed = 330 * S;
      }
    }

    // とげを流す
    const dx = speed * dt;
    for (const o of obstacles) o.x -= dx;
    obstacles = obstacles.filter(o => o.x + o.w > margin - 4);
    if (state !== 'dead') {
      gapLeft -= dx;
      if (gapLeft <= 0) {
        const name = state === 'title'
          ? ['spike', 'tall', 'twin', 'spike', 'saw'][(Math.random() * 5) | 0]
          : pickShape(score);
        const o = makeObstacle(name, W + 40 * S);
        obstacles.push(o);
        const k = state === 'title' ? 1.5 + Math.random() * 0.6 : 0.6 + Math.random() * 0.7;
        gapLeft = o.w + speed * k + 40 * S;
      }
      if (state === 'play') {
        dist += dx / S;
        score = Math.floor(dist / 50);
      }
    }

    // 輪の物理
    if (state !== 'dead') {
      const hold = state === 'title' ? demoBrain(dt) : holding;
      if (h <= 0) coyote = 0.08; else coyote -= dt;
      if (buffer > 0) buffer -= dt;
      if (state === 'play' && buffer > 0 && (h <= 0 || coyote > 0) && vy <= 0) jump();
      if (h > 0 || vy > 0) {
        const g = vy > 0 ? (hold ? 1700 : 5200) : 3000;
        vy -= g * S * dt;
        h += vy * dt;
        if (h <= 0) {
          h = 0;
          if (vy < -200 * S) { squash = Math.min(0.4, -vy / (2600 * S)); addWave(px, Math.min(10 * S, -vy * 0.008)); }
          vy = 0;
        }
      }
      // 当たり判定: 輪の下半分ととげの線
      const r = R(), rc = r * 0.8, cyH = h + r;
      for (let d = -rc; d <= rc; d += 2) {
        const s = surf(px + d);
        if (s > 0 && s > cyH - Math.sqrt(Math.max(0, rc * rc - d * d))) {
          if (state === 'play') { die(); break; }
          demoHits++; break;
        }
      }
    } else {
      // 輪がほどけたあと、ひもは地面に戻る
      if (h > 0) { vy -= 3000 * S * dt; h = Math.max(0, h + vy * dt); }
    }
  }

  // ---------- 数字(一筆書き) ----------
  // 字の箱: 幅0.6 × 高さ1、y=1が線の上(基線)。始点(0,1)、終点(幅,1)。
  const TL = [0, 0], TR = [.6, 0], ML = [0, .5], MR = [.6, .5], BL = [0, 1], BR = [.6, 1];
  const GLYPH = {
    '0': [BL, TL, TR, BR],
    '1': [BL, [.32, 1], [.32, 0], [.12, .2], [.32, 0], [.32, 1], BR],
    '2': [BL, ML, MR, TR, TL, TR, MR, ML, BL, BR],
    '3': [BL, BR, TR, TL, TR, MR, [.12, .5], MR, BR],
    '4': [BL, BR, TR, MR, ML, TL, ML, MR, BR],
    '5': [BL, BR, MR, ML, TL, TR, TL, ML, MR, BR],
    '6': [BL, TL, TR, TL, BL, BR, MR, ML, MR, BR],
    '7': [BL, [.2, 1], TR, TL, TR, [.2, 1], BR],
    '8': [BL, TL, TR, BR, MR, ML, MR, BR],
    '9': [BL, BR, TR, TL, ML, MR, TR, BR],
    'crown': [[0, 1], [0, .28], [.24, .62], [.45, .02], [.66, .62], [.9, .28], [.9, 1]],
    ' ': [[0, 1], [.5, 1]],
  };
  function hudPoints(items) {
    const gh = Math.max(20, 30 * S), gap = gh * 0.36;
    const by = safeTop + 30 + gh;
    const pts = [[margin, by]];
    let x = margin + 12 * S;
    pts.push([x, by]);
    for (const it of items) {
      const g = GLYPH[it];
      let wmax = 0;
      for (const [gx, gyv] of g) { pts.push([x + gx * gh, by - (1 - gyv) * gh]); wmax = Math.max(wmax, gx); }
      x += wmax * gh + gap;
      pts.push([x, by]);
    }
    pts.push([x + 4 * S, by]);
    return pts.reverse(); // 右端から書きはじめ、左端で地面へ降りる
  }

  // ---------- 描画: すべて一本のパス ----------
  function lineY(x) {
    let pull = 0;
    if (h > 0 && loopScale > 0) {
      const d = (x - px) / (70 * S);
      pull = Math.min(h * 0.05, 7 * S) * Math.exp(-d * d) * loopScale;
    }
    return gy - surf(x) - wob(x) - pull;
  }

  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = paper;
    ctx.fillRect(0, 0, W, H);
    if (shake > 0.2) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    const items = [];
    if (state === 'play') items.push(...String(score));
    else if (state === 'dead') { items.push(...String(score)); if (best > 0) items.push(' ', 'crown', ...String(best)); }
    else if (best > 0) items.push('crown', ...String(best));

    const pts = hudPoints(items);

    // 左の壁: 見出しから地面まで降りる
    pts.push([margin, lineY(margin)]);

    // 地面: 細かい標本点 + とげの頂点 + 輪の位置
    const xs = [];
    const step = 7 * S;
    for (let x = margin + step; x < W + 30; x += step) xs.push(x);
    for (const o of obstacles) for (const [vx] of o.v) {
      const x = o.x + vx;
      if (x > margin && x < W + 30) { xs.push(x - 0.01, x, x + 0.01); }
    }
    xs.push(px);
    xs.sort((a, b) => a - b);

    const r = R() * loopScale;
    let placed = false;
    let lastX = -1;
    for (const x of xs) {
      if (x - lastX < 0.005) continue;
      lastX = x;
      if (!placed && x >= px) {
        placed = true;
        const ay = lineY(px);
        pts.push([px, ay]);
        if (r > 0.3) {
          const by = gy - h;
          const sway = Math.max(-14 * S, Math.min(14 * S, -vy * 0.012));
          const tether = [];
          if (ay - by > 1) {
            for (let i = 1; i <= 10; i++) {
              const t = i / 10;
              const cx = px + sway * 2 * t * (1 - t);
              tether.push([cx, ay + (by - ay) * t]);
            }
          }
          for (const p of tether) pts.push(p);
          const sq = Math.max(-0.3, Math.min(0.4, squash));
          const rx = r * (1 + sq), ry = r * (1 - sq);
          const cy = by - ry;
          const N = 44;
          for (let i = 0; i <= N; i++) {
            const th = Math.PI / 2 - (i / N) * Math.PI * 2;
            pts.push([px + rx * Math.cos(th), cy + ry * Math.sin(th)]);
          }
          for (let i = tether.length - 2; i >= 0; i--) pts.push(tether[i]);
          pts.push([px, ay]);
        }
        if (x === px) continue;
      }
      pts.push([x, lineY(x)]);
    }

    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.strokeStyle = ink;
    ctx.lineWidth = Math.max(1.6, 2.4 * S);
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  // ---------- ループ ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(1 / 30, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // テスト用の窓口
  window.__hitosuji = { get state() { return state; }, get score() { return score; }, get h() { return h; }, get demoHits() { return demoHits; } };
})();
</script>
</body>
</html>
