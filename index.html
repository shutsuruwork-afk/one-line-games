<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ひとふで</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap">
<style>
/* Layout: one full-bleed canvas holds the work (a single line); a small museum-style label sits in the lower corner. */
:root {
  --paper: #EEF0EE;
  --ink: #1C2947;
  --ink-soft: #677189;
  --focus: #1C2947;
  --font-hand: "Klee One", "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0D1322;
    --ink: #E6E1D1;
    --ink-soft: #8D96AC;
    --focus: #E6E1D1;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0D1322;
  --ink: #E6E1D1;
  --ink-soft: #8D96AC;
  --focus: #E6E1D1;
  color-scheme: dark;
}

html { box-sizing: border-box; height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-hand);
}
.stage { position: relative; height: 100%; }
canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
  cursor: crosshair;
  outline: none;
}
canvas:focus-visible { box-shadow: inset 0 0 0 2px var(--focus); }

.label {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 14px 40px;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-bottom: 22px;
  pointer-events: none;
}
.label p { margin: 0; }
.eyebrow {
  font-size: 0.75rem;
  letter-spacing: 0.32em;
  color: var(--ink-soft);
}
.name {
  margin-top: 0.2rem !important;
  font-size: clamp(1.6rem, 1.25rem + 1.1vw, 2.15rem);
  font-weight: 600;
  line-height: 1.2;
  transition: opacity 0.38s ease, transform 0.38s ease;
}
.name.out { opacity: 0; transform: translateY(5px); }
.meta {
  margin-top: 0.4rem !important;
  display: flex;
  gap: 0.6em;
  font-size: 0.78rem;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}
.hint {
  font-size: 0.8rem;
  line-height: 1.75;
  color: var(--ink-soft);
  text-align: right;
  transition: opacity 1.2s ease;
}
.hint.quiet { opacity: 0.45; }
@media (max-width: 560px) {
  .hint { text-align: left; }
}
@media (prefers-reduced-motion: reduce) {
  .name, .hint { transition: none; }
}
</style>
</head>
<body>
<main class="stage">
  <canvas id="work" tabindex="0" role="img"
    aria-label="一本の線だけで描かれた連作。線は結び目、日の出、波、渡り鳥、山、木、家、星、地平へと形を変えていきます。画面をなぞると、その線で自分の絵を描けます。"></canvas>
  <footer class="label">
    <div class="caption">
      <p class="eyebrow">ひとふで</p>
      <p class="name" id="name" aria-live="polite">結び</p>
      <p class="meta"><span>一本の線</span><span aria-hidden="true">・</span><span>長さ <span id="len">0</span> px</span></p>
    </div>
    <p class="hint" id="hint">なぞると、この線で描けます<br>タップ・クリックで次の絵へ</p>
  </footer>
</main>

<script>
(() => {
  'use strict';

  // ---------------------------------------------------------------
  // The whole work is one polyline of N points. Every motif is built
  // as a path that enters at the left edge on the horizon and leaves at
  // the right edge on the horizon, then resampled to N points so any
  // motif can turn into any other.
  // ---------------------------------------------------------------
  const N = 2600;
  const L0 = -24;                 // the line starts and ends just off-screen
  const HOLD = 5600;              // ms a motif rests before the next one
  const HOLD_USER = 9000;         // ms a drawing by the viewer rests
  const DUR = 2300;               // ms each point takes to move
  const SPREAD = 1500;            // ms the change takes to travel left → right
  const MAX_SAVED = 3;
  const STORE_KEY = 'hitofude.strokes.v1';

  const canvas = document.getElementById('work');
  const ctx = canvas.getContext('2d');
  const nameEl = document.getElementById('name');
  const lenEl = document.getElementById('len');
  const hintEl = document.getElementById('hint');
  const reduceMQ = matchMedia('(prefers-reduced-motion: reduce)');
  let reduce = reduceMQ.matches;
  reduceMQ.addEventListener?.('change', e => { reduce = e.matches; });

  let W = 0, H = 0, DPR = 1, F = null, lw = 1.6;
  let ink = '#1C2947';

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const TAU = Math.PI * 2;

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // ---------- a pen that records a dense polyline ----------
  class Pen {
    constructor(x, y) { this.p = [x, y]; }
    get x() { return this.p[this.p.length - 2]; }
    get y() { return this.p[this.p.length - 1]; }
    to(x, y) {
      const x0 = this.x, y0 = this.y;
      const n = Math.max(1, Math.ceil(Math.hypot(x - x0, y - y0) / 4));
      for (let i = 1; i <= n; i++) this.p.push(x0 + (x - x0) * i / n, y0 + (y - y0) * i / n);
      return this;
    }
    bez(c1x, c1y, c2x, c2y, x, y) {
      const x0 = this.x, y0 = this.y;
      const approx = Math.hypot(c1x - x0, c1y - y0) + Math.hypot(c2x - c1x, c2y - c1y) + Math.hypot(x - c2x, y - c2y);
      const n = Math.max(2, Math.ceil(approx / 3));
      for (let i = 1; i <= n; i++) {
        const t = i / n, m = 1 - t;
        const a = m * m * m, b = 3 * m * m * t, c = 3 * m * t * t, d = t * t * t;
        this.p.push(a * x0 + b * c1x + c * c2x + d * x, a * y0 + b * c1y + c * c2y + d * y);
      }
      return this;
    }
    fn(f, t0, t1, n) {
      for (let i = 0; i <= n; i++) {
        const q = f(t0 + (t1 - t0) * i / n);
        if (i === 0) this.to(q[0], q[1]); else this.p.push(q[0], q[1]);
      }
      return this;
    }
    arc(cx, cy, r, a0, a1, n) {
      return this.fn(t => [cx + r * Math.cos(t), cy + r * Math.sin(t)], a0, a1, n || Math.max(24, Math.ceil(Math.abs(a1 - a0) * r / 3)));
    }
  }
  const begin = f => new Pen(L0, f.y0);
  const end = (pen, f) => { pen.to(W - L0, f.y0); return pen.p; };

  function resample(p, n) {
    const m = p.length / 2;
    const cum = new Float64Array(m);
    for (let i = 1; i < m; i++) cum[i] = cum[i - 1] + Math.hypot(p[2 * i] - p[2 * i - 2], p[2 * i + 1] - p[2 * i - 1]);
    const total = cum[m - 1];
    const out = new Float32Array(n * 2);
    let j = 0;
    for (let k = 0; k < n; k++) {
      const s = total * k / (n - 1);
      while (j < m - 2 && cum[j + 1] < s) j++;
      const seg = cum[j + 1] - cum[j];
      const t = seg > 0 ? clamp((s - cum[j]) / seg, 0, 1) : 0;
      out[2 * k] = p[2 * j] + (p[2 * j + 2] - p[2 * j]) * t;
      out[2 * k + 1] = p[2 * j + 1] + (p[2 * j + 3] - p[2 * j + 1]) * t;
    }
    return out;
  }

  function chaikin(p, iters) {
    for (let it = 0; it < iters; it++) {
      const q = [p[0], p[1]];
      for (let i = 0; i < p.length - 2; i += 2) {
        const x0 = p[i], y0 = p[i + 1], x1 = p[i + 2], y1 = p[i + 3];
        q.push(0.75 * x0 + 0.25 * x1, 0.75 * y0 + 0.25 * y1, 0.25 * x0 + 0.75 * x1, 0.25 * y0 + 0.75 * y1);
      }
      q.push(p[p.length - 2], p[p.length - 1]);
      p = q;
    }
    return p;
  }

  // ===============================================================
  // Motifs
  // ===============================================================

  // 結び — the line ties a knot in itself and carries on
  function knot(f) {
    const { cx, y0, u } = f;
    const k = 0.072 * u;
    const yc = y0 - 3 * k;
    const p = begin(f);
    p.to(cx, y0);
    p.fn(t => [cx + k * (Math.sin(t) + 2 * Math.sin(2 * t)), yc - k * (Math.cos(t) - 2 * Math.cos(2 * t))], Math.PI, 3 * Math.PI, 420);
    return end(p, f);
  }

  // 日の出 — the sun clears the horizon; its light lies on the water as a
  // narrowing column of strokes. Sun (left → right), light (down, zig-zag),
  // back up the column's left edge, then the waterline (left → right).
  function sunrise(f) {
    const { cx, y0, u } = f;
    const r = 0.16 * u, off = 0.36;
    const cy = y0 - off * r;
    const as = Math.asin(off);
    const c = r * Math.cos(as);
    const p = begin(f);
    p.arc(cx, cy, r, Math.PI - as, TAU + as);
    const depth = 1.3 * r, rows = 4, g = depth / (rows + 1.2);
    const half = y => c * (1 - (y - y0) / depth);
    for (let k = 1; k <= rows; k++) {
      const yk = y0 + k * g, hw = half(yk);
      const dir = k % 2 ? -1 : 1;              // odd rows run right → left
      const xs = cx - dir * hw, xe = cx + dir * hw;
      p.to(xs, yk);
      p.fn(t => [xs + (xe - xs) * t, yk + Math.sin(t * Math.PI * 3) * 0.035 * r], 0, 1, 50);
    }
    p.to(cx, y0 + depth);
    p.to(cx - c, y0);
    p.to(cx + c, y0);
    return end(p, f);
  }

  // 波 — a trochoid: where the swell is strong the line curls over itself
  function waves(f) {
    const { cx, y0, u } = f;
    const lam = clamp(0.19 * u, 50, 130);
    const a = lam / TAU;
    const x0 = L0, x1 = W - L0, span = x1 - x0;
    const T = span / a;
    const phase = -(cx - x0) / a;
    const p = new Pen(x0, y0);
    p.fn(t => {
      const xl = x0 + a * t;
      const g = Math.sin(Math.PI * clamp((xl - x0) / span, 0, 1));
      const e = Math.exp(-Math.pow((xl - cx) / (0.4 * u), 2));
      const set = 1 + 0.18 * Math.sin((xl - cx) / (0.23 * u));
      const b = a * (0.2 * g + 1.75 * e * set);
      const ph = t + phase;
      const dy = -1.35 * b * Math.cos(ph);
      return [xl - b * Math.sin(ph) - 0.32 * e * dy, y0 + dy];
    }, 0, T, Math.ceil(T * 16));
    return p.p;
  }

  // 小鳥 — the horizon turns into a wire, and small birds perch on it.
  // Each bird is a closed outline that leaves the wire at its feet and comes back there.
  const BIRD = [
    [0.00, 0.00], [-0.12, -0.04], [-0.30, 0.00], [-0.50, 0.15], [-0.55, 0.10], [-0.40, -0.10],
    [-0.31, -0.30], [-0.17, -0.50], [0.00, -0.65], [0.14, -0.73], [0.28, -0.70], [0.36, -0.62],
    [0.49, -0.585], [0.36, -0.55], [0.34, -0.46], [0.34, -0.30], [0.25, -0.12], [0.07, 0.00], [0.00, 0.00],
  ];
  function smallBirds(f, rnd) {
    const { cx, y0, u } = f;
    const perch = [[-0.31, 0.17, 1], [0.0, 0.14, -1], [0.29, 0.185, 1]];
    const p = begin(f);
    for (const [bx, bs, face] of perch) {
      const fx = cx + bx * u, s = bs * u * (0.94 + rnd() * 0.12);
      const tilt = (rnd() - 0.5) * 0.12 * face;
      const ct = Math.cos(tilt), st = Math.sin(tilt);
      const V = [];
      for (const [x, y] of BIRD) {
        const lx = x * face, ly = y;
        V.push(fx + (lx * ct - ly * st) * s, y0 + (lx * st + ly * ct) * s);
      }
      // the eye: a small turn of the pen just inside the head
      const ex = fx + (0.22 * face * ct + 0.58 * st) * s, ey = y0 + (0.22 * face * st - 0.58 * ct) * s;
      p.to(fx, y0);
      const S = chaikin(V, 2);
      let eyeAt = 0, best = Infinity;
      for (let i = 0; i < S.length; i += 2) {
        const dd = Math.hypot(S[i] - ex, S[i + 1] - ey);
        if (dd < best) { best = dd; eyeAt = i; }
      }
      for (let i = 0; i < S.length; i += 2) {
        p.to(S[i], S[i + 1]);
        if (i === eyeAt) {
          const er = 0.035 * s;
          const a0 = Math.atan2(S[i + 1] - ey, S[i] - ex);
          p.arc(ex, ey, er, a0, a0 - face * TAU, 28);
          p.to(S[i], S[i + 1]);
        }
      }
    }
    return end(p, f);
  }

  // 山 — a mountain and its reflection in still water, in one stroke
  function mountain(f) {
    const { cx, y0, u } = f;
    const bw = 0.42 * u, h = 0.34 * u, tw = 0.04 * u;
    const m = new Pen(cx - bw, y0);
    m.bez(cx - bw * 0.5, y0 - h * 0.12, cx - tw * 2.2, y0 - h * 0.84, cx - tw, y0 - h);
    m.to(cx - tw * 0.45, y0 - h + 0.014 * u).to(cx + tw * 0.05, y0 - h - 0.003 * u).to(cx + tw * 0.5, y0 - h + 0.012 * u).to(cx + tw, y0 - h);
    m.bez(cx + tw * 2.2, y0 - h * 0.84, cx + bw * 0.5, y0 - h * 0.12, cx + bw, y0);
    const o = m.p;
    const p = begin(f);
    const hx0 = cx - bw - 0.36 * u, hx1 = cx - bw - 0.05 * u;
    if (hx0 > L0 + 10) {
      p.to(hx0, y0);
      p.bez(hx0 + 0.09 * u, y0 - 0.075 * u, hx1 - 0.1 * u, y0 - 0.07 * u, hx1, y0);
    }
    p.to(cx - bw, y0);
    for (let i = 2; i < o.length; i += 2) p.p.push(o[i], o[i + 1]);
    for (let i = o.length - 2; i >= 0; i -= 2) {
      const ry = (y0 - o[i + 1]) * 0.58;
      const wob = Math.sin(ry * 0.32) * 0.013 * u * (ry / (h * 0.58));
      p.p.push(o[i] + wob, y0 + ry);
    }
    p.to(cx + bw, y0);
    return end(p, f);
  }

  // 木 — the outline of a branching tree, traced without lifting the pen
  function tree(f, rnd) {
    const { cx, y0, u } = f;
    const maxD = 5;
    const grow = (x, y, ang, len, w, d) => {
      const n = { x, y, x1: x + Math.cos(ang) * len, y1: y + Math.sin(ang) * len, ang, w, w1: w * 0.64, kids: [] };
      if (d < maxD) {
        const k = d >= 2 && rnd() < 0.12 ? 3 : 2;
        const spread = 0.38 + rnd() * 0.2 + d * 0.03;
        for (let i = 0; i < k; i++) {
          const s = (i / (k - 1)) * 2 - 1;
          const a = clamp(ang + s * spread + (rnd() - 0.5) * 0.3, -Math.PI + 0.25, -0.25);
          n.kids.push(grow(n.x1, n.y1, a, len * (0.72 + rnd() * 0.14), n.w1, d + 1));
        }
      }
      return n;
    };
    const root = grow(cx, y0, -Math.PI / 2 + (rnd() - 0.5) * 0.08, 0.15 * u, 0.06 * u, 0);
    const V = [cx - 0.07 * u, y0, cx - 0.032 * u, y0 - 0.006 * u];
    const leaf = [[0.12, 0.30], [0.55, 0.38], [0.92, 0.14], [1.0, 0], [0.92, -0.14], [0.55, -0.38], [0.12, -0.30]];
    const walk = n => {
      const lx = Math.sin(n.ang), ly = -Math.cos(n.ang);
      V.push(n.x + lx * n.w / 2, n.y + ly * n.w / 2, n.x1 + lx * n.w1 / 2, n.y1 + ly * n.w1 / 2);
      if (n.kids.length) n.kids.forEach(walk);
      else {
        const a = n.ang + (rnd() - 0.5) * 0.7;
        const fx = Math.cos(a), fy = Math.sin(a), sx = Math.sin(a), sy = -Math.cos(a);
        const L = 0.046 * u * (0.75 + rnd() * 0.5);
        for (const [q, s] of leaf) V.push(n.x1 + fx * q * L + sx * s * L, n.y1 + fy * q * L + sy * s * L);
      }
      V.push(n.x1 - lx * n.w1 / 2, n.y1 - ly * n.w1 / 2, n.x - lx * n.w / 2, n.y - ly * n.w / 2);
    };
    walk(root);
    V.push(cx + 0.032 * u, y0 - 0.006 * u, cx + 0.07 * u, y0);
    const S = chaikin(V, 3);
    const p = begin(f);
    for (let i = 0; i < S.length; i += 2) p.to(S[i], S[i + 1]);
    return end(p, f);
  }

  // 家 — a house with a door and smoke from the chimney
  function house(f) {
    const { cx, y0, u } = f;
    const hw = 0.19 * u, wh = 0.2 * u, rh = 0.17 * u, e = 0.04 * u;
    const xl = cx - hw, xr = cx + hw, yt = y0 - wh, yp = yt - rh;
    const roofY = x => yp + (yt - yp) * Math.abs(x - cx) / (hw + e);
    const c0 = cx + 0.075 * u, c1 = cx + 0.125 * u, cTop = yp + 0.025 * u;
    const d0 = cx - 0.115 * u, d1 = cx - 0.035 * u, dTop = y0 - 0.12 * u;
    const p = begin(f);
    p.to(xl, y0).to(xl, yt).to(xl - e, yt).to(cx, yp).to(c0, roofY(c0)).to(c0, cTop);
    // smoke: loops that rise and drift, then a soft return to the chimney
    const sx = (c0 + c1) / 2;
    p.to(sx - 0.004 * u, cTop);
    const sh = 0.2 * u;
    p.fn(t => {
      const q = t / (3 * TAU);
      const r = (0.012 + 0.03 * q) * u;
      const bx = sx + q * q * 0.11 * u, by = cTop - 0.01 * u - q * sh;
      return [bx - r * Math.sin(t), by - r * (1 - Math.cos(t)) * 0.9];
    }, 0, 3 * TAU, 260);
    p.bez(p.x + 0.07 * u, p.y + 0.02 * u, c1 + 0.03 * u, cTop - 0.08 * u, c1, cTop);
    p.to(c1, roofY(c1)).to(xr + e, yt).to(xr, yt).to(xr, y0);
    // door: along the ground, up, over the arch, down, and back along the sill
    p.to(d1, y0).to(d1, dTop);
    p.arc((d0 + d1) / 2, dTop, (d1 - d0) / 2, 0, -Math.PI, 30);
    p.to(d0, y0).to(xr, y0);
    return end(p, f);
  }

  // 星 — star trails. A long exposure turns each star into a ring around the
  // pole; a double spiral draws the rings in one stroke, winding in and back
  // out. Two falling stars mark the way down.
  function stars(f, rnd) {
    const { cx, y0, u } = f;
    // enter at the bottom of the outer ring, wind in counter-clockwise,
    // pass the pole, wind out clockwise, leave from the top
    const R = 0.24 * u, yc = y0 - 0.31 * u, turns = 4, alpha = Math.PI / 2;
    const arm = (s, off) => {
      const r = R * s, a = alpha + off - (1 - s) * turns * TAU;
      return [cx + r * Math.cos(a), yc + r * Math.sin(a)];
    };
    const dir = (a, b) => { const l = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1; return [(b[0] - a[0]) / l, (b[1] - a[1]) / l]; };
    const p = begin(f);
    const E = arm(1, 0);
    const ax = Math.max(L0 + 2, E[0] - 0.3 * u);
    p.to(ax, y0);
    p.bez(ax + 0.16 * u, y0, E[0] - 0.12 * u, E[1], E[0], E[1]);
    p.fn(t => arm(1 - t, 0), 0, 1, 900);
    p.fn(t => arm(t, Math.PI), 0, 1, 900);
    const X = arm(1, Math.PI), [xx, xy] = dir(arm(0.99, Math.PI), X);
    const fall = [[0.3, -0.36, 0.03], [0.42, -0.19, 0.021]];
    fall.forEach(([sx0, sy0, ss], j) => {
      const x = cx + sx0 * u, y = y0 + sy0 * u, s = ss * u;
      const rot = -Math.PI / 2 + (rnd() - 0.5) * 0.4;
      const tip = [x + s * Math.cos(rot), y + s * Math.sin(rot)];
      if (j === 0) p.bez(X[0] + xx * 0.16 * u, X[1] + xy * 0.16 * u, tip[0] - 0.02 * u, tip[1] - 0.08 * u, tip[0], tip[1]);
      else p.bez(p.x + 0.03 * u, p.y + 0.02 * u, tip[0] - 0.03 * u, tip[1] - 0.03 * u, tip[0], tip[1]);
      for (let k = 1; k <= 5; k++) {
        const t = rot + k * 4 * Math.PI / 5;
        p.to(x + s * Math.cos(t), y + s * Math.sin(t));
      }
    });
    const bx = Math.min(W - L0 - 2, cx + 0.6 * u);
    p.bez(p.x + 0.03 * u, p.y + 0.05 * u, bx - 0.08 * u, y0, bx, y0);
    return end(p, f);
  }

  // 地平 — nothing but the line itself
  function horizon(f) {
    return end(begin(f), f);
  }

  // あなたの一筆 — the viewer's own stroke, carried by the same line
  function userPath(f, pts) {
    const { y0, u } = f;
    const p = begin(f);
    const n = pts.length / 2;
    const sx = pts[0], sy = pts[1], ex = pts[2 * n - 2], ey = pts[2 * n - 1];
    const dirAt = (from, step) => {
      const x0 = pts[2 * from], y0_ = pts[2 * from + 1];
      for (let i = from + step; i >= 0 && i < n; i += step) {
        const ddx = pts[2 * i] - x0, ddy = pts[2 * i + 1] - y0_, dl = Math.hypot(ddx, ddy);
        if (dl > 12) return [ddx / dl, ddy / dl];
      }
      return [step, 0];
    };
    const reach = Math.max(40, 0.12 * u);
    const [d0x, d0y] = dirAt(0, 1);
    const [d1x, d1y] = dirAt(n - 1, -1);
    const ax = clamp(sx - reach, L0 + 1, W - L0 - 1);
    p.to(ax, y0);
    p.bez(ax + reach * 0.5, y0, sx - d0x * reach * 0.5, sy - d0y * reach * 0.5, sx, sy);
    for (let i = 1; i < n; i++) p.to(pts[2 * i], pts[2 * i + 1]);
    const bx = clamp(ex + reach, L0 + 1, W - L0 - 1);
    p.bez(ex - d1x * reach * 0.5, ey - d1y * reach * 0.5, bx - reach * 0.5, y0, bx, y0);
    return end(p, f);
  }

  const BASE = [
    { name: '結び', build: knot },
    { name: '日の出', build: sunrise },
    { name: '波', build: waves },
    { name: '小鳥', build: smallBirds },
    { name: '山', build: mountain },
    { name: '木', build: tree },
    { name: '家', build: house },
    { name: '星', build: stars },
    { name: '地平', build: horizon },
  ];

  // ---------- the viewer's strokes, kept in this browser only ----------
  const toNorm = (x, y) => [(x - F.cx) / F.u, (y - F.y0) / F.u];
  const fromNorm = arr => {
    const out = new Array(arr.length);
    for (let i = 0; i < arr.length; i += 2) { out[i] = F.cx + arr[i] * F.u; out[i + 1] = F.y0 + arr[i + 1] * F.u; }
    return out;
  };
  const userScene = norm => ({ name: 'あなたの一筆', user: true, norm, build: f => userPath(f, smooth(fromNorm(norm))) });
  function smooth(pts) {
    if (pts.length < 6) return pts;
    const out = pts.slice();
    for (let i = 2; i < pts.length - 2; i += 2) {
      out[i] = (pts[i - 2] + 2 * pts[i] + pts[i + 2]) / 4;
      out[i + 1] = (pts[i - 1] + 2 * pts[i + 1] + pts[i + 3]) / 4;
    }
    return out;
  }
  function loadSaved() {
    try {
      const raw = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
      return Array.isArray(raw) ? raw.filter(a => Array.isArray(a) && a.length >= 4).slice(-MAX_SAVED).map(userScene) : [];
    } catch (_) { return []; }
  }
  function saveAll() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(saved.map(s => s.norm.map(v => Math.round(v * 1000) / 1000))));
    } catch (_) { /* storage unavailable: strokes stay for this visit only */ }
  }
  let saved = [];
  const cycle = () => BASE.concat(saved);

  // ---------- state ----------
  let cur = new Float32Array(N * 2), from = new Float32Array(N * 2), to = new Float32Array(N * 2);
  const disp = new Float32Array(N * 2), buf = new Float32Array(N * 2);
  const side = new Float32Array(N * 2), side2 = new Float32Array(N * 2);
  const wraw = new Float32Array(N), wbuf = new Float32Array(N);
  function blur(src, dst, r) {
    let acc = 0;
    for (let i = -r; i <= r; i++) acc += src[clamp(i, 0, N - 1)];
    for (let i = 0; i < N; i++) {
      dst[i] = acc / (2 * r + 1);
      acc += src[Math.min(N - 1, i + r + 1)] - src[Math.max(0, i - r)];
    }
  }
  let trans = null, follow = false;
  let clock = 0, holdUntil = HOLD, phase = 'hold', autoplay = true;
  let idx = 0, showing = null;

  function buildShowing(sh) {
    return resample(sh.scene.build(F, mulberry32(sh.seed)), N);
  }
  const holdFor = sc => (sc && sc.user ? HOLD_USER : HOLD) * (reduce ? 1.6 : 1);

  function show(scene, instant) {
    showing = { scene, seed: (Math.random() * 4294967296) >>> 0 };
    const t = buildShowing(showing);
    to.set(t);
    follow = false;
    if (instant || reduce) {
      cur.set(t); from.set(t); trans = null;
      phase = 'hold'; holdUntil = clock + holdFor(scene);
    } else {
      from.set(cur);
      trans = { t0: clock };
      phase = 'trans';
    }
    setCaption(scene.name);
  }
  function advance(dir) {
    const list = cycle();
    idx = (idx + dir + list.length) % list.length;
    show(list[idx], false);
  }

  let capTimer = 0;
  function setCaption(text) {
    if (nameEl.textContent === text && !nameEl.classList.contains('out')) return;
    clearTimeout(capTimer);
    if (reduce) { nameEl.textContent = text; return; }
    nameEl.classList.add('out');
    capTimer = setTimeout(() => { nameEl.textContent = text; nameEl.classList.remove('out'); }, 380);
  }
  let interacted = false;
  function quietHint() {
    if (interacted) return;
    interacted = true;
    hintEl.classList.add('quiet');
  }

  // ---------- drawing with the line ----------
  let down = null, stroke = null, hover = null;
  function beginStroke(x, y) {
    stroke = toNorm(x, y);
    phase = 'draw'; trans = null; follow = true;
    setCaption('あなたの一筆');
    quietHint();
  }
  function extendStroke(x, y) {
    const n = stroke.length;
    const [nx, ny] = toNorm(x, y);
    if (Math.hypot(nx - stroke[n - 2], ny - stroke[n - 1]) * F.u < 1.5) return false;
    if (n > 6000) return false;
    stroke.push(nx, ny);
    return true;
  }
  function refreshStroke() {
    to.set(resample(userPath(F, smooth(fromNorm(stroke))), N));
  }
  function endStroke() {
    let len = 0;
    for (let i = 2; i < stroke.length; i += 2) len += Math.hypot(stroke[i] - stroke[i - 2], stroke[i + 1] - stroke[i - 1]);
    len *= F.u;
    if (len > 24) {
      const sc = userScene(stroke.slice());
      saved.push(sc);
      if (saved.length > MAX_SAVED) saved = saved.slice(-MAX_SAVED);
      if (idx >= BASE.length) idx = BASE.length - 1;
      saveAll();
      showing = { scene: sc, seed: 0 };
      phase = 'hold';
      holdUntil = clock + holdFor(sc);
    } else {
      stroke = null;
      advance(1);
      return;
    }
    stroke = null;
  }

  canvas.addEventListener('pointerdown', e => {
    if (e.button && e.button !== 0) return;
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    down = { x: e.offsetX, y: e.offsetY, id: e.pointerId };
    hover = null;
  });
  canvas.addEventListener('pointermove', e => {
    if (down && e.pointerId === down.id) {
      if (!stroke) {
        if (Math.hypot(e.offsetX - down.x, e.offsetY - down.y) < 8) return;
        beginStroke(down.x, down.y);
      }
      const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
      let changed = false;
      for (const ev of (evs.length ? evs : [e])) changed = extendStroke(ev.offsetX, ev.offsetY) || changed;
      if (changed) refreshStroke();
    } else if (e.pointerType !== 'touch') {
      hover = { x: e.offsetX, y: e.offsetY };
    }
  });
  const release = e => {
    if (!down || e.pointerId !== down.id) return;
    if (stroke) endStroke();
    else if (e.type === 'pointerup') { quietHint(); advance(1); }
    down = null;
  };
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);
  canvas.addEventListener('pointerleave', () => { hover = null; });
  canvas.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ' || e.key === 'Enter') { e.preventDefault(); quietHint(); advance(1); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); quietHint(); advance(-1); }
  });

  // ---------- size & colour ----------
  function resize() {
    const r = canvas.getBoundingClientRect();
    W = Math.max(1, r.width); H = Math.max(1, r.height);
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    F = { cx: W / 2, y0: H * (W > H ? 0.63 : 0.6), u: Math.min(W * 0.9, H * 0.76) };
    lw = clamp(F.u / 290, 1.85, 2.8);
    if (!showing) return;
    if (phase === 'draw' && stroke) { refreshStroke(); return; }
    const t = buildShowing(showing);
    to.set(t);
    if (!trans) cur.set(t);
  }
  function readInk() {
    const v = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim();
    if (v) ink = v;
  }

  // ---------- frame loop ----------
  const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  let last = performance.now(), frameNo = 0;

  function tick(now) {
    const dt = Math.min(64, Math.max(0, now - last)); last = now;
    clock += dt;
    frameNo++;
    if (frameNo % 30 === 1) readInk();

    if (phase === 'hold' && autoplay && !down && clock >= holdUntil) advance(1);

    if (trans) {
      const el = clock - trans.t0;
      if (el >= DUR + SPREAD) {
        cur.set(to); trans = null;
        phase = 'hold'; holdUntil = clock + holdFor(showing.scene);
      } else {
        for (let i = 0; i < N; i++) {
          const k = ease(clamp((el - SPREAD * i / (N - 1)) / DUR, 0, 1));
          const j = 2 * i;
          cur[j] = from[j] + (to[j] - from[j]) * k;
          cur[j + 1] = from[j + 1] + (to[j + 1] - from[j + 1]) * k;
        }
      }
    } else if (follow) {
      const k = 1 - Math.exp(-dt / 70);
      for (let j = 0; j < N * 2; j++) cur[j] += (to[j] - cur[j]) * k;
    }

    // the line gives way a little where the cursor passes
    const R = clamp(F.u * 0.16, 50, 110), R2 = R * R, push = R * 0.32;
    const kd = 1 - Math.exp(-dt / 140);
    const hx = hover && phase !== 'draw' ? hover.x : -1e9, hy = hover ? hover.y : -1e9;
    for (let i = 0; i < N; i++) {
      const j = 2 * i;
      let tx = 0, ty = 0;
      const ddx = cur[j] - hx, ddy = cur[j + 1] - hy, d2 = ddx * ddx + ddy * ddy;
      if (d2 < R2) {
        const d = Math.sqrt(d2) || 1, fall = 1 - d / R, s = fall * fall * push;
        tx = ddx / d * s; ty = ddy / d * s;
      }
      disp[j] += (tx - disp[j]) * kd;
      disp[j + 1] += (ty - disp[j + 1]) * kd;
    }

    render(clock);
    requestAnimationFrame(tick);
  }

  function render(t) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    const amp = reduce ? 0 : 0.75;
    const ts = t * 0.001;
    for (let i = 0; i < N; i++) {
      const j = 2 * i;
      let x = cur[j] + disp[j], y = cur[j + 1] + disp[j + 1];
      if (amp) {
        const a = 2 * Math.max(0, i - 1), b = 2 * Math.min(N - 1, i + 1);
        const tx = cur[b] - cur[a], ty = cur[b + 1] - cur[a + 1], tl = Math.hypot(tx, ty) || 1;
        const w = amp * (0.6 * Math.sin(i * 0.043 + ts * 0.8) + 0.4 * Math.sin(i * 0.011 - ts * 0.5) + 0.15 * Math.sin(i * 0.17 + ts * 1.7));
        x += -ty / tl * w; y += tx / tl * w;
      }
      buf[j] = x; buf[j + 1] = y;
    }
    // Brush weight: a pen moves fast on long straight runs and slows in the
    // turns, so the line is thin where it travels and full where it draws.
    for (let i = 0; i < N; i++) {
      const a = 2 * Math.max(0, i - 3), b = 2 * Math.min(N - 1, i + 3), c = 2 * i;
      const ax = cur[c] - cur[a], ay = cur[c + 1] - cur[a + 1];
      const bx = cur[b] - cur[c], by = cur[b + 1] - cur[c + 1];
      const la = Math.hypot(ax, ay), lb = Math.hypot(bx, by);
      let k = 0;
      if (la > 1e-3 && lb > 1e-3) k = Math.abs(Math.atan2(ax * by - ay * bx, ax * bx + ay * by)) / Math.max(1.5, (la + lb) / 2);
      wraw[i] = 0.55 + 0.8 * (1 - Math.exp(-k * 30));
    }
    blur(wraw, wbuf, 10); blur(wbuf, wraw, 10);
    for (let i = 0; i < N; i++) {
      const j = 2 * i;
      const a = 2 * Math.max(0, i - 1), b = 2 * Math.min(N - 1, i + 1);
      const tx = buf[b] - buf[a], ty = buf[b + 1] - buf[a + 1], tl = Math.hypot(tx, ty) || 1;
      const h = lw * wraw[i] / 2;
      const nx = -ty / tl * h, ny = tx / tl * h;
      side[j] = buf[j] + nx; side[j + 1] = buf[j + 1] + ny;
      side2[j] = buf[j] - nx; side2[j + 1] = buf[j + 1] - ny;
    }
    ctx.beginPath();
    ctx.moveTo(side[0], side[1]);
    for (let i = 1; i < N - 1; i++) {
      const j = 2 * i;
      ctx.quadraticCurveTo(side[j], side[j + 1], (side[j] + side[j + 2]) / 2, (side[j + 1] + side[j + 3]) / 2);
    }
    ctx.lineTo(side[2 * N - 2], side[2 * N - 1]);
    ctx.lineTo(side2[2 * N - 2], side2[2 * N - 1]);
    for (let i = N - 2; i > 0; i--) {
      const j = 2 * i;
      ctx.quadraticCurveTo(side2[j], side2[j + 1], (side2[j] + side2[j - 2]) / 2, (side2[j + 1] + side2[j - 1]) / 2);
    }
    ctx.lineTo(side2[0], side2[1]);
    ctx.closePath();
    ctx.fillStyle = ink;
    ctx.fill('nonzero');

    if (frameNo % 8 === 1) {
      let len = 0;
      for (let i = 1; i < N; i++) {
        const xa = Math.max(0, Math.min(W, buf[2 * i - 2])), xb = Math.max(0, Math.min(W, buf[2 * i]));
        len += Math.hypot(xb - xa, buf[2 * i + 1] - buf[2 * i - 1]);
      }
      lenEl.textContent = Math.round(len).toLocaleString('ja-JP');
    }
  }

  // ---------- start ----------
  readInk();
  resize();
  saved = loadSaved();
  show(BASE[0], true);
  window.addEventListener('resize', resize);
  requestAnimationFrame(t => { last = t; tick(t); });

  // small handle for whoever wants to look at one motif at a time
  window.hitofude = {
    scenes: () => cycle().map(s => s.name),
    go(i) { const list = cycle(); idx = ((i % list.length) + list.length) % list.length; show(list[idx], true); },
    pause(on = true) { autoplay = !on; },
  };
})();
</script>
</body>
</html>
